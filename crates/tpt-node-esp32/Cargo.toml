[package]
name = "tpt-node-esp32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ESP32 HAL for TPT Embedded Node — UART/BLE/Flash transports via tpt-embedded-core."
license.workspace = true

[features]
std = []
# Real hardware support. Not a default feature: `cargo build --workspace` on
# a host target must keep working without pulling in esp-hal (which targets
# `riscv32imc-unknown-none-elf`/xtensa only). Build/flash with e.g.
# `cargo build -p tpt-node-esp32 --release --target riscv32imc-unknown-none-elf --features esp32c3`.
esp32c3 = [
    "dep:esp-hal",
    "dep:esp-hal-embassy",
    "dep:esp-backtrace",
    "dep:esp-println",
    "dep:esp-alloc",
    "dep:embassy-executor",
    "esp-hal/esp32c3",
    "esp-hal-embassy/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
]

[dependencies]
tpt-node-core = { path = "../tpt-node-core" }
tpt-e-link = { workspace = true }
embassy-executor = { workspace = true, optional = true }
esp-hal = { version = "0.22", default-features = false, optional = true }
esp-hal-embassy = { version = "0.5", default-features = false, optional = true }
esp-backtrace = { version = "0.15", default-features = false, features = ["exception-handler", "panic-handler", "println"], optional = true }
esp-println = { version = "0.13", default-features = false, features = ["uart"], optional = true }
esp-alloc = { version = "0.5", optional = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
