[package]
name = "tpt-node-riscv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generic RISC-V HAL for TPT Embedded Node — UART transport via riscv-rt + embedded-hal."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["embedded", "riscv", "iot", "no-std", "tpt"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
std = ["tpt-e-link/std", "tpt-node-core/std"]
# Real hardware support. Enable exactly one chip feature to pull in the
# matching `riscv-rt` / `embedded-hal` BSP. Not default: `cargo build
# --workspace` on a host target must keep working without pulling in
# `riscv-rt` (which only targets bare-metal RISC-V). Build/flash with e.g.
# `cargo build -p tpt-node-riscv --release --target
# riscv32imac-unknown-none-elf --features gd32v`.
gd32v = [
    "dep:riscv-rt",
    "dep:gd32vf103xx-hal",
]
sifive = [
    "dep:riscv-rt",
    "dep:e310x-hal",
]

[dependencies]
tpt-node-core = { path = "../tpt-node-core" }
tpt-e-link = { workspace = true }
embedded-hal = "1"
embedded-hal-nb = "1"
nb = "1"
riscv = "0.11"
riscv-rt = { version = "0.13", optional = true }
gd32vf103xx-hal = { version = "0.5", optional = true }
e310x-hal = { version = "0.12", optional = true }

# `target_os = "none"` (bare-metal ELF targets, e.g.
# `riscv32imac-unknown-none-elf`) excludes these: Cargo pulls dev-dependencies
# into every dev-profile artifact for the package, including examples,
# regardless of whether that particular example uses them — so unscoped
# `std`-requiring dev-deps like `pollster` break embedded example builds even
# though only the host-only `#[cfg(test)]` modules reference them.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
pollster = "1"
heapless = { version = "0.8", features = ["serde"] }

# Hardware bring-up binary; only buildable with a BSP pulled in. Gated so a
# plain `cargo build/test --workspace` on a host target doesn't try to compile
# it.
[[example]]
name = "gd32v_node"
required-features = ["gd32v"]

[lints.clippy]
all = { level = "warn", priority = -1 }
